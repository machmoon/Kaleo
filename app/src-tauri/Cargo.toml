[package]
name = "kaleo"
version = "0.3.1"
description = "Hardy: silkscreen's desktop app - describe a board, the engine generates it, review the result. A GPL-3.0 fork of Pluely."
authors = ["Pat Liu <liujkaleo@gmail.com>", "Srikanth Nani <mail@srikanthnani.com> (upstream Pluely)"]
license = "GPL-3.0"
repository = "https://github.com/machmoon/silkscreen"
homepage = "https://github.com/machmoon/silkscreen"
documentation = "https://github.com/machmoon/silkscreen"
readme = "../README.md"
keywords = ["ai-assistant", "tauri", "desktop-app", "privacy-first", "meeting-assistant"]
categories = ["gui", "multimedia", "accessibility", "science", "development-tools"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kaleo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` + `image-png`: the menu bar status item (src/tray.rs) and the
# `Image::from_bytes` that decodes its PNG glyphs.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2.5.2"
tauri-plugin-dialog = "=2.4.0"
tauri-plugin-fs = "=2.4.2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
cpal = "0.15.3"
hound = "3.5.1"
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
livekit-wakeword = "0.1"
tauri-plugin-shell = "2.3.1"
portable-pty = "0.9"
tauri-plugin-notification = "2.4.0"
tauri-plugin-store = "2.4.4"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19.0"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.0"

# Wake-word inference in `tauri dev`. The dev profile builds every crate at
# opt-level 0, and at that level one livekit-wakeword score of a 2 s window
# took 3.08 s (measured 2026-09-13, M-series Mac) against 0.23 s with these
# crates optimised — the spotter could not keep up with the microphone and
# never saw "Hey Ada" whole. Only the inference crates are listed, so the
# rest of the app keeps fast debug builds.
[profile.dev.package.livekit-wakeword]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.ort]
opt-level = 3
[profile.dev.package.ort-tract]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
