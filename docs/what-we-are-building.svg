<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Silkscreen turns a board request into a verified PCB placement</title>
  <desc id="desc">Five-step visual showing the integrated prompt-to-KiCad builder, verifier-gated placement repair, and pre-routing canonical-board adapter.</desc>
  <defs>
    <style>
      .bg { fill: #eee7dc; }
      .paper { fill: #fbf7ef; stroke: #342e28; stroke-width: 2; }
      .paper-soft { fill: #f5efe5; stroke: #7b7165; stroke-width: 1.5; }
      .ink { fill: #29241f; font-family: ui-rounded, "SF Pro Rounded", "Nunito Sans", system-ui, sans-serif; }
      .title { font-size: 48px; font-weight: 760; text-anchor: middle; }
      .subtitle { font-size: 21px; font-weight: 540; text-anchor: middle; fill: #665d53; }
      .lane { font-size: 17px; font-weight: 800; letter-spacing: 2px; }
      .step { font-size: 25px; font-weight: 760; }
      .body { font-size: 18px; font-weight: 540; }
      .small { font-size: 15px; font-weight: 620; }
      .tiny { font-size: 13px; font-weight: 680; }
      .badge { fill: #29241f; stroke: #fbf7ef; stroke-width: 4; }
      .badge-text { fill: #fbf7ef; font-size: 25px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
      .arrow { fill: none; stroke: #29241f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .gap-arrow { fill: none; stroke: #a66b22; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 9; }
      .feedback { fill: none; stroke: #405f8f; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 7 7; }
      .live { fill: #e5f1e7; stroke: #347842; stroke-width: 2; }
      .model { fill: #e7edf6; stroke: #405f8f; stroke-width: 2; }
      .rules { fill: #f6e9e6; stroke: #8f2f27; stroke-width: 2; }
      .next { fill: #fff2d8; stroke: #a66b22; stroke-width: 2; }
      .positive { fill: #347842; }
      .warning { fill: #a66b22; }
      .accent { fill: #8f2f27; }
      .blue { fill: #405f8f; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#29241f"/>
    </marker>
    <marker id="arrow-gap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a66b22"/>
    </marker>
    <marker id="arrow-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#405f8f"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <text class="ink title" x="800" y="66">Silkscreen builds and repairs PCB placement</text>
  <text class="ink subtitle" x="800" y="102">Ask for a board, watch the agent act, verify every move, then keep the trace that teaches the next policy.</text>

  <rect x="34" y="132" width="932" height="40" rx="20" fill="#ded7cc"/>
  <text class="ink lane" x="58" y="158">LIVE BUILD PATH</text>
  <text class="ink small positive" x="922" y="158" text-anchor="end">working locally</text>

  <rect x="989" y="132" width="577" height="40" rx="20" fill="#ded7cc"/>
  <text class="ink lane" x="1013" y="158">LIVE REPAIR PATH</text>
  <text class="ink small positive" x="1542" y="158" text-anchor="end">working on verifier boards</text>

  <!-- Step 1 -->
  <g id="step-1">
    <rect class="paper" x="34" y="190" width="286" height="500" rx="22"/>
    <circle class="badge" cx="68" cy="224" r="26"/>
    <text class="badge-text" x="68" y="225">1</text>
    <text class="ink step" x="105" y="232">Ask for a board</text>
    <rect class="paper-soft" x="62" y="280" width="230" height="98" rx="15"/>
    <text class="ink body" x="82" y="314">“Build a compact</text>
    <text class="ink body" x="82" y="342">motor controller.”</text>
    <rect class="model" x="62" y="408" width="230" height="82" rx="15"/>
    <text class="ink small blue" x="82" y="438">Optional team preference</text>
    <text class="ink body" x="82" y="468">thermal first</text>
    <path class="arrow" d="M177 520 L177 568" marker-end="url(#arrow)"/>
    <rect class="live" x="62" y="594" width="230" height="64" rx="15"/>
    <text class="ink body positive" x="177" y="633" text-anchor="middle">Intent + profile</text>
  </g>

  <path class="arrow" d="M327 440 L350 440" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g id="step-2">
    <rect class="paper" x="356" y="190" width="286" height="500" rx="22"/>
    <circle class="badge" cx="390" cy="224" r="26"/>
    <text class="badge-text" x="390" y="225">2</text>
    <text class="ink step" x="427" y="232">Build the circuit</text>
    <rect class="model" x="384" y="280" width="230" height="84" rx="15"/>
    <text class="ink small blue" x="499" y="312" text-anchor="middle">Circuit agent</text>
    <text class="ink body" x="499" y="341" text-anchor="middle">Gemini with failover</text>
    <path class="arrow" d="M499 390 L499 430" marker-end="url(#arrow)"/>
    <rect class="rules" x="384" y="455" width="230" height="92" rx="15"/>
    <text class="ink small accent" x="499" y="486" text-anchor="middle">Deterministic gate</text>
    <text class="ink body" x="499" y="516" text-anchor="middle">validate CircuitSpec</text>
    <path class="arrow" d="M499 572 L499 602" marker-end="url(#arrow)"/>
    <rect class="live" x="384" y="618" width="230" height="40" rx="13"/>
    <text class="ink small positive" x="499" y="644" text-anchor="middle">valid circuit only</text>
  </g>

  <path class="arrow" d="M649 440 L672 440" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g id="step-3">
    <rect class="paper" x="678" y="190" width="288" height="500" rx="22"/>
    <circle class="badge" cx="712" cy="224" r="26"/>
    <text class="badge-text" x="712" y="225">3</text>
    <text class="ink step" x="749" y="232">Place and export</text>
    <rect class="live" x="706" y="280" width="232" height="84" rx="15"/>
    <text class="ink small positive" x="822" y="312" text-anchor="middle">CP-SAT solver</text>
    <text class="ink body" x="822" y="341" text-anchor="middle">exact coordinates</text>
    <path class="arrow" d="M822 388 L822 425" marker-end="url(#arrow)"/>
    <rect x="720" y="450" width="204" height="128" rx="16" fill="#315c49" stroke="#234235" stroke-width="2"/>
    <circle cx="743" cy="474" r="7" fill="#d7c56c"/>
    <circle cx="901" cy="474" r="7" fill="#d7c56c"/>
    <circle cx="743" cy="554" r="7" fill="#d7c56c"/>
    <circle cx="901" cy="554" r="7" fill="#d7c56c"/>
    <rect x="774" y="476" width="72" height="54" rx="6" fill="#25292b" stroke="#e2ddd3" stroke-width="2"/>
    <rect x="855" y="493" width="32" height="24" rx="4" fill="#d8d0c4"/>
    <path d="M751 512 C777 512 767 548 804 548 C841 548 840 537 881 537" fill="none" stroke="#d7c56c" stroke-width="3"/>
    <rect class="live" x="706" y="610" width="232" height="48" rx="13"/>
    <text class="ink small positive" x="822" y="640" text-anchor="middle">download .kicad_pcb</text>
  </g>

  <!-- Canonical generated-board adapter -->
  <path class="arrow" d="M973 440 L1002 440" marker-end="url(#arrow)"/>
  <rect class="live" x="887" y="705" width="376" height="66" rx="16"/>
  <text class="ink small positive" x="1075" y="733" text-anchor="middle">LIVE: generated-board adapter</text>
  <text class="ink tiny" x="1075" y="756" text-anchor="middle">integer nm to bounded mm, before routing</text>
  <path class="arrow" d="M975 705 C975 667 995 640 1023 617" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g id="step-4">
    <rect class="paper" x="1008" y="190" width="270" height="500" rx="22"/>
    <circle class="badge" cx="1042" cy="224" r="26"/>
    <text class="badge-text" x="1042" y="225">4</text>
    <text class="ink step" x="1079" y="232">Propose repairs</text>
    <rect class="paper-soft" x="1036" y="280" width="214" height="106" rx="15"/>
    <text class="ink small" x="1143" y="311" text-anchor="middle">Damaged placement</text>
    <rect x="1062" y="330" width="62" height="31" rx="5" fill="#8f2f27"/>
    <rect x="1098" y="344" width="74" height="31" rx="5" fill="#405f8f" opacity="0.92"/>
    <rect x="1183" y="330" width="38" height="31" rx="5" fill="#797168"/>
    <path class="arrow" d="M1143 411 L1143 445" marker-end="url(#arrow)"/>
    <rect class="model" x="1036" y="470" width="214" height="106" rx="15"/>
    <text class="ink small blue" x="1143" y="502" text-anchor="middle">Proposal policy</text>
    <text class="ink body" x="1143" y="532" text-anchor="middle">deterministic default</text>
    <text class="ink tiny" x="1143" y="557" text-anchor="middle">local models are opt-in</text>
    <rect class="live" x="1036" y="610" width="214" height="48" rx="13"/>
    <text class="ink small positive" x="1143" y="640" text-anchor="middle">short action batch</text>
  </g>

  <path class="arrow" d="M1285 440 L1308 440" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <g id="step-5">
    <rect class="paper" x="1314" y="190" width="252" height="500" rx="22"/>
    <circle class="badge" cx="1348" cy="224" r="26"/>
    <text class="badge-text" x="1348" y="225">5</text>
    <text class="ink step" x="1385" y="232">Verify moves</text>
    <rect class="rules" x="1342" y="280" width="196" height="106" rx="15"/>
    <text class="ink small accent" x="1440" y="311" text-anchor="middle">Geometry verifier</text>
    <text class="ink body" x="1440" y="340" text-anchor="middle">hard rules decide</text>
    <text class="ink tiny" x="1440" y="366" text-anchor="middle">the model cannot override</text>
    <path class="arrow" d="M1440 411 L1440 445" marker-end="url(#arrow)"/>
    <rect class="live" x="1342" y="470" width="196" height="106" rx="15"/>
    <text class="ink small positive" x="1440" y="502" text-anchor="middle">Commit improving prefix</text>
    <text class="ink body" x="1440" y="532" text-anchor="middle">legal placement</text>
    <text class="ink tiny" x="1440" y="557" text-anchor="middle">accepted + rejected trace</text>
    <rect class="model" x="1342" y="610" width="196" height="48" rx="13"/>
    <text class="ink small blue" x="1440" y="640" text-anchor="middle">future SFT + RL data</text>
  </g>

  <!-- Feedback memory -->
  <rect class="model" x="1010" y="788" width="556" height="34" rx="17"/>
  <text class="ink small blue" x="1288" y="811" text-anchor="middle">Engineer correction → team profile + training trace</text>

  <!-- Result strip -->
  <rect class="paper" x="34" y="838" width="1532" height="128" rx="22"/>
  <rect x="54" y="858" width="168" height="88" rx="16" fill="#29241f"/>
  <text x="138" y="897" fill="#fbf7ef" font-family="ui-rounded, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">MEASURED LOCALLY</text>
  <text x="138" y="925" fill="#fbf7ef" font-family="ui-rounded, system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">working proof</text>

  <text class="ink small" x="258" y="882">Prompt to routed KiCad</text>
  <text class="ink positive" x="258" y="920" font-size="27" font-weight="820">integrated pipeline</text>
  <text class="ink tiny" x="258" y="942">model stages + deterministic gates</text>

  <line x1="565" y1="858" x2="565" y2="946" stroke="#8c8276" stroke-width="1.5"/>
  <text class="ink small" x="600" y="882">Verifier repair demo</text>
  <text class="ink positive" x="600" y="920" font-size="29" font-weight="820">11.4 → 0.0 mm</text>
  <text class="ink tiny" x="600" y="942">4 geometry faults → 0</text>

  <rect class="next" x="920" y="858" width="622" height="88" rx="16"/>
  <text class="ink small warning" x="946" y="886">HONEST BOUNDARY</text>
  <text class="ink body" x="946" y="916">Placement repair now runs before routing.</text>
  <text class="ink tiny" x="946" y="939">Fabrication and electrical proof remain separate; trained policies are not claimed.</text>
</svg>
