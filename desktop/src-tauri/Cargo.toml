[package]
name = "ada-desktop"
version = "0.1.0"
description = "Native desktop shell for the Ada hardware engineering agent"
authors = ["Ada contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "ada_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-http = "2"
url = "2"
