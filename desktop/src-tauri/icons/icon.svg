  <g fill="none" stroke="#D68C42" stroke-width="44" stroke-linejoin="round">
    <path d="M164.5 124.5 V386.5"/>
    <path d="M349.5 124.5 L164.5 256 L359.5 386.5"/>
  </g>
  <g fill="#D68C42">
    <circle cx="164.5" cy="124.5" r="38.5"/>
    <circle cx="164.5" cy="386.5" r="38.5"/>
    <circle cx="349.5" cy="124.5" r="38.5"/>
    <circle cx="359.5" cy="386.5" r="38.5"/>
  </g>
  <g fill="#1E6A48">
    <circle cx="164.5" cy="124.5" r="17.5"/>
    <circle cx="164.5" cy="386.5" r="17.5"/>
