name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The SPICE tests in engine/tests/test_spice.py skip without a simulator,
      # so without this the end-to-end simulation coverage would silently
      # vanish in CI while still reporting green. ngspice is packaged on Linux
      # and macOS; on Windows those tests skip and the rest still run.
      - name: install ngspice (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: install ngspice (macos)
        if: runner.os == 'macOS'
        run: brew install ngspice
      # The ``cad`` extra (build123d/OCCT) has wheels for all three OSes; it
      # is the only enclosure engine, and the kernel tests skip without it
      # exactly the way the ngspice ones do, so installing it here is what
      # keeps that coverage from vanishing while CI still reports green.
      - run: pip install -e ".[dev,agents,cloud,adk,cad]"
      - run: ruff check engine service scripts desktop googleapps zoombot teamsbot
      - run: pytest -q
      # Fails if README/DEVPOST quote a test count that is no longer true.
      # That figure has gone stale repeatedly (40 -> 54 -> 143 -> 160 -> 183).
      # If this is what broke your build: python scripts/check_docs.py --fix
      - run: python scripts/check_docs.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Vitest over frontend/src/lib. Node environment, no jsdom: the lib modules are
      # DOM-free, and the only global they need is the fetch Node 22 already has.
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # The desktop client. Its hardening tests read the shipped Tauri config and
  # assert two properties that have each shipped broken once: that the http
  # capability scope parses at all (one unparseable entry rejects the whole
  # scope, blocking every request the app makes), and that no window is
  # excluded from screen capture. Guards nothing catches locally are guards
  # that rot, so they run here.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
      - run: npx vitest run
        working-directory: app

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: rustup component add rustfmt clippy
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets
      # This compiles the embedded Svelte bundle and validates Tauri's config
      # without producing an installer. Python bundling/signing are not ready.
      - run: cargo build --manifest-path desktop/src-tauri/Cargo.toml --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nothing else exercises the Dockerfile; a build is the whole check.
      - run: docker build .
